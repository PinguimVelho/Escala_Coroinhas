<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/missasADM.css">
    <title>Escala GCA - Missas</title>
</head>

<body>
    <header>
        <h1>Missas - Coordenadores</h1>

        <div class="profile">
            <span class="username">...</span>
        </div>
    </header>

    <main>

        <button id="createTable">+ Criar escala</button>

        <section id="tablesContainer">

            <!-- Exemplo de escala -->
            <div class="table-card">

                <div class="table-header">
                    <div class="scale-info">
                        <span class="scale-time">18:00</span>
                        <span class="scale-coordinator">Coordenador: Antônio</span>
                    </div>

                    <div class="table-actions">
                        <button class="btn-edit">Editar escala</button>
                        <button class="delete-table">Excluir escala</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Coroinha</th>
                            <th>Função</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Antônio</td>
                            <td>Turíbulo</td>
                        </tr>
                        <tr>
                            <td>Luís</td>
                            <td>Naveta</td>
                        </tr>
                        <tr>
                            <td>Júlia</td>
                            <td>Cruz</td>
                        </tr>
                    </tbody>
                </table>

                <button class="btn-add">+ Adicionar coroinha</button>
            </div>
            

            <!-- Novas escalas serão inseridas aqui pelo JavaScript -->

        </section>

    </main>
    <script>
        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            if (data.perm == 'user') {
                window.location.href = "/missas"
                return
            }
            document.querySelector(".profile .username").textContent = data.username
        }
        init()
    </script>
</body>

</html>
