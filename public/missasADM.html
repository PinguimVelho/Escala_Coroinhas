<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="missasADM.js" defer></script>
    <link rel="stylesheet" href="./css/missasADM.css">
    <title>Escala GCA - Missas</title>
</head>

<body>
    <header>
        <h1>Missas - Coordenadores</h1>

        <div class="profile">
            <span class="username">...</span>
        </div>
    </header>

    <main>

        <button id="createTable">+ Criar escala</button>

        <section id="tablesContainer">

        </section>

    </main>
    <script>
        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            if (data.perm == 'user') {
                window.location.href = "/missas"
                return
            }
            document.querySelector(".profile .username").textContent = data.username
        }
        init()
    </script>
</body>

</html>
